<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-950 text-slate-100">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#020617"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Spacetac"><meta name="application-name" content="Spacetac"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Spacetac</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>try{tailwind.config={future:{hoverOnlyWhenSupported:true}}}catch(e){}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Rajdhani',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.font-orbitron{font-family:'Orbitron',sans-serif}
.glass-panel{background:rgba(10,15,30,.82);backdrop-filter:blur(12px);border:1px solid rgba(56,189,248,.2);box-shadow:0 8px 32px 0 rgba(0,0,0,.5)}
.glass-panel-rose{background:rgba(25,10,15,.9);backdrop-filter:blur(12px);border:1px solid rgba(244,63,94,.3)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:rgba(15,23,42,.6)}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.4);border-radius:3px}
.dis{opacity:.35;pointer-events:none}
html,body{height:100dvh}
header{padding-top:max(.5rem,env(safe-area-inset-top))}
#mainNav{padding-bottom:max(.5rem,env(safe-area-inset-bottom));scrollbar-width:none}
#mainNav::-webkit-scrollbar{display:none}
.nb{flex:0 0 auto;white-space:nowrap}
#hintBar{top:calc(var(--hh,90px) + 6px)!important}
#alertBanner{top:calc(var(--hh,90px) + 48px)!important}
@keyframes pop{from{transform:scale(.3) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{from{box-shadow:0 0 6px currentColor}to{box-shadow:0 0 28px currentColor}}
.pullcard{animation:pop .5s both;border-width:2px;border-style:solid;border-radius:.6rem;background:rgba(2,6,23,.9);padding:.5rem;text-align:center}
.glowL{animation:pop .5s both,glow 1s infinite alternate}
.bar{height:6px;border-radius:3px;background:#1e293b;overflow:hidden}.bar>div{height:100%}
#fxFlash{position:fixed;inset:0;pointer-events:none;z-index:35;opacity:0}
#tipBox{position:fixed;left:0;top:0;z-index:70;pointer-events:none;max-width:260px;padding:.35rem .6rem;border-radius:.4rem;background:rgba(2,6,23,.96);border:1px solid rgba(56,189,248,.45);color:#e2e8f0;font-size:11px;line-height:1.4;white-space:pre-line;box-shadow:0 4px 18px rgba(0,0,0,.6);opacity:0;transition:opacity .12s}
#tipBox.on{opacity:1}
#resPop{position:fixed;z-index:60;width:310px;max-width:calc(100vw - 16px);overflow-y:auto}
.resItem{cursor:pointer;padding:2px 6px;border-radius:.35rem;border:1px solid transparent;transition:background .15s,border-color .15s}
.resItem.act{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.45)}@media (hover:hover){.resItem:hover{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.45)}}
@media(max-width:640px){
 header{gap:.35rem;padding-left:.4rem;padding-right:.4rem}
 #hdrTitle,header>div:first-child>button,#audioBtn{display:none}
 #resBar{order:3;width:100%;flex-wrap:nowrap!important;overflow-x:auto;white-space:nowrap;font-size:11px}
 #modalRoot,#modal2Root{padding:0!important}
 #modalRoot>div,#modal2Root>div{max-width:none!important;width:100%;height:100dvh;max-height:100dvh!important;border-radius:0!important}
 #modalBody,#modal2Body{font-size:13px;padding-bottom:max(1rem,env(safe-area-inset-bottom))}
 #modalBody button,#modal2Body button{min-height:38px;font-size:12px!important}
 #modalBody .flex.items-center.justify-between{flex-wrap:wrap;gap:4px}
 #targetPanel{left:.5rem!important;right:.5rem!important;top:auto!important;bottom:calc(62px + env(safe-area-inset-bottom));width:auto!important;max-height:44vh!important}
 #targetPanel:not(.hidden)~#minimap{display:none}
 #minimap{width:84px!important;height:84px!important;bottom:calc(66px + env(safe-area-inset-bottom))!important}
 #logPanel{bottom:calc(62px + env(safe-area-inset-bottom))!important;height:38vh!important}
 .nb{padding:.55rem .8rem;font-size:12px}
 table{font-size:11px}
}


/* ===== MOBILE/TOUCH-OPTIMIERUNG ===== */
html,body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none}
#galaxyCanvas,#minimap{touch-action:none}
header,#mainNav{padding-left:max(.5rem,env(safe-area-inset-left));padding-right:max(.5rem,env(safe-area-inset-right))}
#minimap{left:max(.5rem,env(safe-area-inset-left))!important}
#modalBody,#modal2Body,#targetPanel,#logPanel,#resPop{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#zoomCtl{display:none;position:absolute;right:max(.5rem,env(safe-area-inset-right));bottom:calc(66px + env(safe-area-inset-bottom));z-index:15;flex-direction:column;gap:8px}
#zoomCtl button{width:46px;height:46px;border-radius:12px;background:rgba(10,15,30,.88);border:1px solid rgba(56,189,248,.4);color:#7dd3fc;font:700 22px/1 Orbitron,sans-serif;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.5)}
#zoomCtl button:active{background:rgba(8,145,178,.55);border-color:#22d3ee}
@media(pointer:coarse){
 #zoomCtl{display:flex}
 #targetPanel:not(.hidden)~#zoomCtl{display:none}
 .nb{min-height:44px;padding:.55rem .9rem;font-size:12px}
 header button{min-width:40px;min-height:40px}
 #modalRoot button,#modal2Root button,#targetPanel button,#resPop button,#alertBanner button,#hintBar button{min-height:40px}
 [onclick^="closeModal"],[onclick^="closeTarget"],#hintBar button:last-child{min-width:44px;min-height:44px}
 #modalRoot input:not([type=range]):not([type=checkbox]):not([type=radio]),#modal2Root input:not([type=range]):not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important;min-height:40px}
 input[type=range]{min-height:32px}
 #modalRoot>div,#modal2Root>div{max-height:calc(100dvh - 1rem)!important}
 .resItem{padding:6px 8px}
 #modalBody tr{min-height:40px}
}
@media(pointer:coarse) and (max-height:480px){
 header{padding-top:max(.25rem,env(safe-area-inset-top))!important;padding-bottom:.25rem!important;gap:.25rem}
 #hdrTitle{display:none}
 #mainNav{padding-top:.25rem!important;padding-bottom:max(.25rem,env(safe-area-inset-bottom))!important}
 .nb{min-height:38px;padding:.3rem .7rem}
 #minimap{width:80px!important;height:80px!important;bottom:calc(50px + env(safe-area-inset-bottom))!important}
 #zoomCtl{bottom:calc(52px + env(safe-area-inset-bottom));flex-direction:row}
 #zoomCtl button{width:42px;height:42px}
 #logPanel{bottom:calc(50px + env(safe-area-inset-bottom))!important;height:40vh!important;left:calc(96px + env(safe-area-inset-left))!important}
 #targetPanel{top:calc(var(--hh,50px) + 6px)!important;max-height:calc(100dvh - var(--hh,50px) - 64px)!important;width:300px}
 #modalRoot,#modal2Root{padding:0!important}
 #modalRoot>div,#modal2Root>div{max-width:none!important;width:100%;height:100dvh;max-height:100dvh!important;border-radius:0!important}
 #modalBody,#modal2Body{padding-bottom:max(1rem,env(safe-area-inset-bottom))}
 #hintBar{padding:.2rem .6rem}
}

/* ===== Seitenbuttons + 4er-Navigation (Mobile) ===== */
.sideCol{display:none}
@media (pointer:coarse),(max-width:640px){
 .sideCol{display:flex;flex-direction:column;gap:8px;position:absolute;top:50%;transform:translateY(-50%);z-index:15}
 #sideL{left:max(.5rem,env(safe-area-inset-left))}
 #sideR{right:max(.5rem,env(safe-area-inset-right))}
 #targetPanel:not(.hidden)~.sideCol{display:none}
 .sb{width:54px;min-height:50px;padding:.4rem 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:.6rem;background:rgba(10,15,30,.88);border:1px solid rgba(56,189,248,.35);color:#7dd3fc;font:700 9px Orbitron,sans-serif;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.5)}
 .sb i{font-size:17px}.sb:active{background:rgba(8,145,178,.5)}
 #mainNav{overflow:hidden!important;flex-wrap:nowrap!important;justify-content:space-between!important;gap:.35rem}
 #mainNav .nb{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:.4rem .15rem;font-size:10px;letter-spacing:0;overflow:hidden}
 #mainNav .nb[onclick*="'trade'"],#mainNav .nb[onclick*="'gacha'"],#mainNav .nb[onclick*="toggleLog"]{display:none}
 #logPanel{height:30vh!important}
}
@media (pointer:coarse) and (max-height:480px){
 #mainNav .nb{flex-direction:row;gap:6px;font-size:11px}
 #logPanel{height:40vh!important}
}

/* ===== Hochformat-Layout, Ressourcen oben, Ton-Button, Eingabefelder ===== */
input,textarea,select,[contenteditable]{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default}
html{-webkit-text-size-adjust:100%}
@media (max-width:640px),(pointer:coarse) and (orientation:portrait){
 header{padding-top:max(.35rem,env(safe-area-inset-top))!important;padding-bottom:.35rem!important;gap:.3rem!important;align-items:stretch}
 header>div:first-child{display:none!important}
 #resBar{order:-1!important;width:100%;display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px 2px;overflow:hidden!important;white-space:nowrap;padding:.3rem .4rem!important;font-size:11px;justify-items:start}
 #resBar .resItem{min-width:0;padding:3px 2px;gap:3px}
 #resBar .resItem span{overflow:hidden;text-overflow:ellipsis}
 header>div:last-child{width:100%;display:flex!important;justify-content:space-between;gap:.25rem!important}
 header>div:last-child button{flex:1 1 0;min-width:0!important;min-height:42px;padding:.25rem 0!important;display:flex;align-items:center;justify-content:center}
 #audioBtn{display:flex!important}
 #speedBtn{font-size:12px}
 #modalBody,#modal2Body{overflow-x:hidden}
 #modalRoot>div>div:first-child,#modal2Root>div>div:first-child{position:sticky;top:0;z-index:2;padding-top:max(.5rem,env(safe-area-inset-top))}
}

/* ===== v3.8: kompakte Kopfleiste, Menü, Heim-Button ===== */
#hdrMenu{position:fixed;right:max(.5rem,env(safe-area-inset-right));top:calc(var(--hh,90px) + 4px);z-index:45;width:230px}
#hdrMenu.hidden{display:none}
#hdrMenu button{display:flex;align-items:center;gap:6px;padding:.5rem .55rem;min-height:42px;border-radius:.5rem;background:rgba(15,23,42,.92);border:1px solid rgba(56,189,248,.3);color:#e2e8f0;font:600 12px Rajdhani,sans-serif}
#hdrMenu button:active{background:rgba(8,145,178,.5)}
#menuBtn{display:none}
#repBtn.off{opacity:.55;color:#94a3b8}
@media (max-width:640px),(pointer:coarse) and (orientation:portrait){
 header{display:grid!important;grid-template-columns:minmax(0,1fr) auto;gap:.35rem!important;align-items:stretch}
 #resBar{order:0!important;width:auto!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;align-content:center;gap:2px 2px!important;font-size:11px!important}
 header>div:last-child{width:auto!important;display:grid!important;grid-template-columns:repeat(2,42px);grid-auto-rows:42px;gap:4px!important;justify-content:end}
 header>div:last-child button{min-width:0!important;min-height:0!important;width:42px;height:42px;padding:0!important;flex:none!important;font-size:15px}
 header button[onclick*="'search'"],header button[onclick*="'rank'"],header button[onclick*="'profile'"],header button[onclick*="'help'"],#audioBtn,#repBtn{display:none!important}
 #menuBtn{display:flex!important;align-items:center;justify-content:center}
 #speedBtn{font-size:12px!important}
}
@media (pointer:coarse) and (orientation:landscape) and (min-width:641px){#menuBtn{display:none!important}}

/* ===== v3.8.1: einheitliche Schiffszeilen, Menü-Umbau ===== */
.shipctl{display:inline-flex;align-items:center;gap:4px}
@media (max-width:640px),(pointer:coarse){
 #modalBody .shiprow{flex-direction:column!important;align-items:stretch!important;flex-wrap:nowrap!important;gap:4px!important;margin-bottom:10px}
 #modalBody .shipctl{display:grid!important;grid-template-columns:1.2fr 1fr 1fr 1fr 1.2fr;gap:4px;width:100%}
 #modalBody .shipctl2{grid-template-columns:1fr 1fr 1fr}
 #modalBody .shipctl b{width:auto!important;text-align:center}
 #modalBody .shipctl button{width:100%;padding-left:0;padding-right:0}
}
@media (max-width:640px),(pointer:coarse) and (orientation:portrait){
 header button[onclick*="'search'"]{display:flex!important;align-items:center;justify-content:center}
 header button[onclick*="'daily'"]{display:none!important}
}
@media (pointer:coarse) and (orientation:landscape) and (min-width:641px){header button[onclick*="'daily'"]{display:inline-block!important;display:flex!important}}
#hdrMenu button{position:relative}
.mdot{position:absolute;top:4px;right:6px;width:9px;height:9px;border-radius:9999px;background:#f43f5e}
</style>
</head>
<body class="h-full w-full relative bg-black text-slate-100 flex flex-col justify-between">
<canvas id="galaxyCanvas" class="absolute inset-0 w-full h-full z-0" style="touch-action:none;cursor:crosshair"></canvas>

<header class="relative z-10 p-2 flex flex-wrap items-center justify-between gap-2 glass-panel border-b border-cyan-500/30">
  <div class="flex items-center gap-2">
    <div class="bg-cyan-950/80 p-2 rounded-lg border border-cyan-500/50 flex items-center gap-2">
      <i class="fa-solid fa-shuttle-space text-cyan-400 text-xl"></i>
      <div id="hdrTitle"><h1 class="font-orbitron text-xs font-bold text-cyan-300 tracking-wider">SPACETAC</h1>
      <span id="sectorText" class="text-[10px] text-slate-400">Sektor [0, 0]</span></div>
    </div>
    <button onclick="openModal('empire')" title="Deine Kolonien – Klick: Imperium &amp; Gebäude verwalten" class="px-2 py-1.5 rounded bg-slate-900/80 hover:bg-cyan-900/40 border border-slate-700 text-xs"><i class="fa-solid fa-globe text-cyan-400"></i> Kolonien <b id="hudCol" class="text-cyan-300">1</b></button>
    <button onclick="openModal('fleets')" title="Platzierte / gesamte Flotten – Klick: Flottenverwaltung" class="px-2 py-1.5 rounded bg-slate-900/80 hover:bg-cyan-900/40 border border-slate-700 text-xs"><i class="fa-solid fa-jet-fighter text-cyan-400"></i> Flotten <b id="hudFleets" class="text-cyan-300">0</b></button>
  </div>
  <div id="resBar" class="flex flex-wrap items-center gap-2 text-xs font-mono bg-slate-900/70 px-3 py-1.5 rounded-lg border border-slate-800"></div>
  <div class="flex items-center gap-1.5">
    <button onclick="goHome()" id="homeBtn" title="Zum Heimatplaneten springen" class="p-2 bg-slate-900 border border-slate-700 hover:border-amber-400 rounded text-amber-300"><i class="fa-solid fa-house"></i></button>
    <button onclick="toggleReports()" id="repBtn" title="Kampfberichte ein-/ausschalten" class="p-2 bg-slate-900 border border-slate-700 hover:border-rose-400 rounded text-rose-300"><i class="fa-solid fa-file-lines"></i></button>
    <button onclick="cycleSpeed()" id="speedBtn" title="Spielgeschwindigkeit 1x / 2x / 4x / 10x – beschleunigt Produktion, Forschung und Flotten (Klick = wechseln)" class="px-2 py-1.5 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded text-cyan-300 text-xs font-orbitron">1x</button>
    <button onclick="openModal('search')" title="Suche: Planeten und Flotten finden" class="p-2 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded text-cyan-400"><i class="fa-solid fa-magnifying-glass"></i></button>
    <button onclick="openModal('rank')" title="Galaxie-Rangliste: du gegen alle KI-Imperien" class="p-2 bg-slate-900 border border-slate-700 hover:border-amber-400 rounded text-amber-400"><i class="fa-solid fa-ranking-star"></i></button>
    <button onclick="toggleAudio()" id="audioBtn" title="Ton an/aus" class="p-2 bg-slate-900 border border-slate-700 rounded text-slate-300"><i class="fa-solid fa-volume-high"></i></button>
    <button onclick="openModal('daily')" title="Tagesbelohnung abholen (Tokens, Credits, Rohstoffe)" class="p-2 bg-slate-900 border border-slate-700 hover:border-emerald-400 rounded text-emerald-400 relative"><i class="fa-solid fa-gift"></i><span id="dailyDot" class="hidden absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-rose-500"></span></button><button onclick="openModal('profile')" title="Profil &amp; Spielstand" class="p-2 bg-slate-900 border border-slate-700 hover:border-sky-400 rounded text-sky-300"><i class="fa-solid fa-user-astronaut"></i></button><button onclick="openModal('help')" title="Hilfe" class="p-2 bg-slate-900 border border-slate-700 rounded text-slate-300"><i class="fa-solid fa-circle-question"></i></button><button onclick="toggleHdrMenu(event)" id="menuBtn" title="Mehr" class="p-2 bg-slate-900 border border-slate-700 rounded text-cyan-300 relative"><i class="fa-solid fa-ellipsis-vertical"></i><span id="menuDot" class="hidden absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-rose-500"></span></button>
  </div>
</header>

<div id="hintBar" class="hidden absolute top-16 left-1/2 -translate-x-1/2 z-20 glass-panel rounded-lg px-3 py-1.5 text-xs text-cyan-200 flex items-center gap-2 max-w-[92vw]">
  <i class="fa-solid fa-hand-pointer text-cyan-400"></i><span id="hintText"></span>
  <button id="tapBtn" onclick="toggleTapMove()" title="An: ein Tipp auf die Karte bewegt die aktive Flotte (statt Doppelklick)" class="px-2 py-0.5 rounded border border-cyan-500/40 text-[10px] whitespace-nowrap">Tippen=Bewegen</button><button onclick="setActive(null)" title="Flotten-Auswahl aufheben" class="text-slate-400 hover:text-white ml-1"><i class="fa-solid fa-xmark"></i></button>
</div>

<aside id="targetPanel" class="hidden absolute top-20 right-2 md:right-4 z-20 w-72 md:w-80 max-h-[70vh] overflow-y-auto glass-panel rounded-xl p-3 flex flex-col gap-2">
  <div class="flex justify-between items-start border-b border-slate-700/60 pb-2">
    <div><span id="targetType" class="text-[10px] font-mono tracking-widest text-cyan-400 uppercase"></span>
    <h2 id="targetTitle" class="font-orbitron text-base font-bold text-white"></h2></div>
    <button onclick="closeTarget()" title="Schließen" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div id="targetDetails" class="text-xs space-y-1.5 text-slate-300 font-mono"></div>
  <div id="targetActions" class="flex flex-col gap-2 pt-2 border-t border-slate-700/60"></div>
</aside>

<div id="alertBanner" onclick="alertJump()" class="hidden cursor-pointer absolute top-28 left-1/2 -translate-x-1/2 z-30 max-w-md w-[92vw] px-4 py-2 glass-panel-rose rounded-lg border border-rose-500/60 flex items-center justify-between shadow-2xl">
  <div class="flex items-center gap-3"><i class="fa-solid fa-triangle-exclamation text-rose-500 text-xl animate-pulse"></i>
    <div><h4 class="font-orbitron text-xs font-bold text-rose-300">ANGRIFFSWARNUNG <span class="text-[10px] text-slate-400">(klicken = zum Ort springen)</span></h4>
    <p id="alertText" class="text-xs text-slate-200"></p></div></div>
  <button onclick="event.stopPropagation();doRetreat()" title="Alle Flotten im Gefahrenbereich zu einer sicheren Kolonie schicken" class="px-2 py-1 rounded bg-rose-700 hover:bg-rose-600 text-white text-[11px] font-orbitron whitespace-nowrap ml-2"><i class="fa-solid fa-person-running"></i> Rückzug</button><button onclick="event.stopPropagation();hideAlert()" title="Warnung ausblenden" class="text-rose-400 text-sm ml-2"><i class="fa-solid fa-x"></i></button>
</div>

<div id="toast" class="hidden absolute bottom-24 left-1/2 -translate-x-1/2 z-50 glass-panel rounded-lg px-4 py-2 text-xs text-slate-100 max-w-[90vw] text-center"></div>

<canvas id="minimap" title="Minikarte: gelbes Rechteck = dein Sichtfeld, rot = Angreifer" width="150" height="150" class="absolute left-2 bottom-16 z-10 w-[120px] h-[120px] md:w-[150px] md:h-[150px] rounded border border-cyan-500/40 bg-black/70" style="touch-action:none"></canvas>

<div id="logPanel" class="hidden absolute left-2 bottom-[190px] md:bottom-[225px] z-20 w-80 max-w-[90vw] h-52 overflow-y-auto glass-panel rounded-lg p-2 text-[11px] font-mono"></div>

<nav id="mainNav" class="relative z-10 p-2 glass-panel border-t border-cyan-500/30 flex gap-2 overflow-x-auto md:flex-wrap md:justify-center">
  <button onclick="openModal('fleets')" title="Flotten zusammenstellen, platzieren und befehligen" class="nb"><i class="fa-solid fa-jet-fighter"></i> Flotten</button>
  <button onclick="openModal('yard')" title="Raumwerft: Schiffe, Minen und Flak-Plattformen bauen" class="nb"><i class="fa-solid fa-industry"></i> Werft</button>
  <button onclick="openModal('research')" title="Forschung: Waffen, Antrieb, Wirtschaft … (eine gleichzeitig)" class="nb"><i class="fa-solid fa-flask"></i> Forschung</button>
  <button onclick="openModal('trade')" title="Handel: Rohstoffe kaufen und verkaufen" class="nb"><i class="fa-solid fa-scale-balanced"></i> Handel</button>
  <button onclick="openModal('empire')" title="Imperium: Kolonien, Förderanlagen, Kraftwerke &amp; mehr" class="nb"><i class="fa-solid fa-globe"></i> Imperium</button>

function inOwnTerr(x,y){const cx=cellX(x),cy=cellY(y);let q=-1,bd=1e18;
 for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const xx=cx+dx,yy=cy+dy;if(xx<0||yy<0||xx>=N||yy>=N)continue;const p=planets[yy*N+xx],d=(p.x-x)*(p.x-x)+(p.y-y)*(p.y-y);if(d<bd){bd=d;q=p.id}}
 if(q<0||planets[q].owner!==0)return false;
 const P=vorPoly(q);let ins=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)ins=!ins}return ins}

function nearby(x,y,r,pred){const out=[],cx=cellX(x),cy=cellY(y),k=Math.ceil(r/CELL);
 for(let dy=-k;dy<=k;dy++)for(let dx=-k;dx<=k;dx++){const x2=cx+dx,y2=cy+dy;if(x2<0||y2<0||x2>=N||y2>=N)continue;const a=FH.get(y2*N+x2);if(!a)continue;
  for(const f of a)if(!f.dead&&pred(f)&&Math.hypot(f.x-x,f.y-y)<=r)out.push(f)}return out}

 const placed=fleets.filter(f=>f.owner===0&&f.placed&&basePower(f.ships)>0);

 const t=kind==='planet'?planets[id]:fleetById.get(id);
 let pre=activeFleet&&placed.find(f=>f.id===activeFleet)?activeFleet:null;
 if(!pre){let bd=1e18;for(const f of placed){const d=Math.hypot(f.x-t.x,f.y-t.y);if(d<bd){bd=d;pre=f.id}}}
 atk={kind,id,fid:pre};renderAttack();$('modal2Root').classList.remove('hidden');playSound('click')}
function renderAttack(){
 if(!atk)return;const t=atk.kind==='planet'?planets[atk.id]:fleetById.get(atk.id);if(!t||t.dead){closeModal2();return}
 const info=defendersOf(atk.kind,t),placed=fleets.filter(f=>f.owner===0&&f.placed&&basePower(f.ships)>0);
 const mine=fleetById.get(atk.fid),dm=mods(info.owner),am=mods(0);
 let dEnemy=0;for(const d of info.dicts)dEnemy+=basePower(d);
 const allShips={};for(const d of info.dicts)for(const k in d)allShips[k]=(allShips[k]||0)+d[k];
 let est=mine?estimate(mine.ships,0,info):{aE:0,dE:estimate({},0,info).dE};
 const ratio=est.dE>0?est.aE/est.dE:9,win=ratio>1;
 const lw=win?lossFrac(est.dE/est.aE):1,verdict=ratio>1.3?['Sieg sehr wahrscheinlich','text-emerald-400']:ratio>1.05?['Sieg wahrscheinlich, knapp','text-lime-400']:ratio>.9?['Ausgeglichen – riskant!','text-amber-400']:['Niederlage wahrscheinlich','text-rose-400'];
 const eta=mine?Math.hypot(mine.x-t.x,mine.y-t.y)/fleetSpeed(mine):0;
 let h=`<div class="grid md:grid-cols-2 gap-3">`+card(`<h4 class="font-orbitron text-rose-300 mb-1">Feindliche Streitkräfte</h4><div class="mb-1">Ziel: <b>${info.name}</b></div>${info.kind==='planet'?`<div class="text-slate-400">Garnison & stationierte Flotten (${info.fleets.length}):</div>`:`<div class="text-slate-400">Flotte & Begleiter (${info.fleets.length}):</div>`}<div class="my-1">${shipsHtml(allShips)}</div>${info.turret?`<div>Geschütztürme: <b>${fmt(info.turret*(1-am.tdis))}</b> Stärke</div>`:''}<div class="mt-1">Effektive Gesamtstärke: <b class="text-rose-300 text-sm">${fmt(est.dE)}</b></div><div class="text-[10px] text-slate-500">Basisstärke ${fmt(dEnemy)} • Bonus Waffen ${pct(dm.atk)} / Panzerung ${pct(dm.arm)}</div>`)
 +card(`<h4 class="font-orbitron text-cyan-300 mb-1">Deine Flotte wählen</h4><div class="max-h-40 overflow-y-auto space-y-1">${placed.map(f=>`<div onclick="atkSel(${f.id})" class="cursor-pointer p-1.5 rounded border ${f.id===atk.fid?'border-cyan-400 bg-cyan-950/50':'border-slate-700 hover:border-slate-500'}"><b>${f.name}</b> • Stärke ${fmt(fleetPower(f))} • ${Math.round(Math.hypot(f.x-t.x,f.y-t.y))} Einheiten<br>${shipsHtml(f.ships)}</div>`).join('')}</div>`)+`</div>`;
 h+=card(mine?`<div class="grid sm:grid-cols-3 gap-2 text-center"><div>Deine eff. Stärke<br><b class="text-cyan-300 text-sm">${fmt(est.aE)}</b></div><div>Prognose<br><b class="${verdict[1]} text-sm">${verdict[0]}</b></div><div>Erwartete Verluste (Sieg)<br><b class="text-amber-300 text-sm">${win?pct(lw*(1-am.rep)):'100% – alle Schiffe'}</b></div></div><div class="text-center mt-1 text-slate-400">Flugzeit ca. ${Math.round(eta)} s${win&&lw<.03?' • praktisch verlustfrei':''}</div>`:'<div class="text-rose-300">Keine Flotte gewählt.</div>','mt-3');
 h+=`<div class="flex justify-end gap-2 mt-3">${btn('<i class="fa-solid fa-ban"></i> Abbrechen','closeModal2()','slate')}${btn('<i class="fa-solid fa-crosshairs"></i> Angriff starten','launchAttack()','rose',!mine)}</div>`;
 $('modal2Title').textContent='ANGRIFFSPLANUNG';setHtml($('modal2Body'),h)}

function launchAttack(){const f=fleetById.get(atk.fid);if(!f||!f.placed){return}
 f.guard=null;f.retreat=false;setAttack(f,atk.kind,atk.id);setActive(f.id);toast(`${f.name} startet den Angriff!`);playSound('alert');closeModal2();closeTarget();refreshUI()}

 h+=`<div class="grid md:grid-cols-2 gap-3">`+card(`<h4 class="font-orbitron text-cyan-300 mb-1">Angreifer: ${r.attName}</h4><div>Eff. Stärke: <b>${fmt(r.aE)}</b></div><div class="mt-1 text-slate-400">Verluste:</div>${shipsHtml(r.attLost)}<div class="mt-1 text-slate-400">Überlebende:</div>${shipsHtml(r.left)}`)
 +card(`<h4 class="font-orbitron text-rose-300 mb-1">Verteidiger: ${r.defName}</h4><div>Eff. Stärke: <b>${fmt(r.dE)}</b></div><div class="mt-1 text-slate-400">Verluste:</div>${shipsHtml(r.defLost)}`)+`</div>${lootCard}<div class="flex justify-end mt-3">${btn('Schließen','closeModal2()')}</div>`;

 h+=`<div class="grid md:grid-cols-2 gap-3">`;
 for(const f of mine){const ed=canEdit(f),col=fleetCol[f.id];

  +(col?'':(''+(types.length?`<div class="space-y-0.5 mb-2">${types.map(s=>`<div class="flex items-center justify-between shiprow"><span${rarCol(s.id)?` style="color:${rarCol(s.id)}" title="${RAR[s.r].n}"`:''}><i class="fa-solid ${s.icon} ${rarCol(s.id)?'':'text-cyan-400'}"></i> ${s.name} <span class="text-slate-500">(Hangar ${S.hangar[s.id]||0})</span></span><span class="shipctl ${ed?'':'dis'}">${btn('-10',`moveShips(${f.id},'${s.id}',-10)`,'slate')} ${btn('-1',`moveShips(${f.id},'${s.id}',-1)`,'slate')} <b class="inline-block w-10 text-center">${f.ships[s.id]||0}</b> ${btn('+1',`moveShips(${f.id},'${s.id}',1)`,'slate')} ${btn('+10',`moveShips(${f.id},'${s.id}',10)`,'slate')}</span></div>`).join('')}</div>`:'<div class="text-slate-500 mb-2">Keine Schiffe verfügbar.</div>')
  +xRkRows(f,ed)+(ed?'':'<div class="text-[10px] text-amber-300 mb-1">Umbau nur im Orbit nahe einer eigenen Kolonie möglich.</div>')

function newPlayerFleet(all){const n=fleets.filter(f=>f.owner===0).length+1;const f=newFleet(0,'Flotte '+S.nextF,{},false);if(all){for(const t in S.hangar)f.ships[t]=S.hangar[t];S.hangar={}}refreshUI()}
function moveShips(fid,t,d){const f=fleetById.get(fid);if(!f||!canEdit(f))return;

 if(!(S.hangar[t]>0))delete S.hangar[t];refreshUI()}

 ensureB();const defs=[['mine','Weltraummine','fa-bomb',MINE_COST,'mine_tech',`Schaden ${fmt(Math.round(MINE_D*(1+tb('mdmg'))))} (Superschiffe halten mehrere Treffer aus) • Auslöse-Radius ${Math.round(MINE_R*(1+tb('mrad')))} • einmalig • Platziert: <b>${S.mines.length}/${mineCap()}</b>`],['aa','Stationäre Flak','fa-satellite-dish',AA_COST,'flak_tech',`Dauerfeuer ${fmt(Math.round(AA_DPS*(1+tb('fdmg'))))}/s • Reichweite ${Math.round(AA_R*(1+tb('frng')))} • nur auf Planeten, max. ${aaSlots()} je Planet • Platziert: <b>${S.aa.length}</b>`]];

  +(ok?`<div class="flex gap-1 flex-wrap">${btn('Bauen ×1',`buildDef('${k}',1)`)}${btn('×5',`buildDef('${k}',5)`)}${btn(k==='mine'?'Mit Flotte legen':'Platzieren',`armBuild('${k}')`,'amber',!S.stock[k])}</div>`:`<div class="text-rose-400 cursor-pointer" onclick="gotoTechFromYard('${req}')"><i class="fa-solid fa-lock"></i> Benötigt: ${TECHS.find(t=>t.id===req).name} (Klick)</div>`),ok?'':'opacity-70')}

function rResearch(){
 let h=`<div class="flex flex-wrap gap-1 mb-3">${Object.entries(TREES).map(([k,t])=>`<button onclick="S.tab='${k}';renderModal()" class="px-3 py-1.5 rounded border text-[11px] font-orbitron ${S.tab===k?'bg-cyan-900/60 border-cyan-400 text-white':'bg-slate-900 border-slate-700 text-slate-300'}"><i class="fa-solid ${t.i} ${t.c}"></i> ${t.n}</button>`).join('')}</div><div class="text-slate-400 mb-2">Labor-Rabatt: ${pct(Math.min(.4,.03*bsum('lab')))}</div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">`;
 for(const t of TECHS.filter(t=>t.tree===S.tab)){const l=S.lv[t.id]||0,maxed=l>=t.max,miss=t.req.filter(r=>!(S.lv[r]>0)),c=techCost(t),ok=!maxed&&!miss.length;
  h+=card(`<div class="flex justify-between"><b class="font-orbitron text-white">${t.name}</b><span class="${maxed?'text-emerald-400':'text-cyan-300'}">${l}/${t.max}</span></div><div class="text-slate-400 my-1">${t.desc}</div>`

function doResearch(id){const t=TECHS.find(x=>x.id===id),l=S.lv[id]||0;if(l>=t.max||t.req.some(r=>!(S.lv[r]>0)))return;const c=techCost(t);if(!canPay(c)){toast('Nicht genug Ressourcen.');return}

const tradeFee=()=>Math.max(.06,.15-Math.min(.06,.005*bsum('hub'))-tb('trade'));
function rTrade(){const fee=tradeFee();
 let h=`<div class="mb-2 flex flex-wrap items-center gap-2"><span class="text-amber-300 font-bold text-sm"><i class="fa-solid fa-coins"></i> ${fmt(S.res.credits)} Credits</span><span class="text-slate-400">Marktgebühr ${(fee*100).toFixed(1)}% (senkbar durch Handelszentren & Techs)</span></div>
 <div class="mb-3 flex items-center gap-1">Menge: ${[1,10,100,1000,10000].map(q=>`<button onclick="S.tq=${q};renderModal()" class="px-2 py-1 rounded border text-[11px] ${S.tq===q?'bg-cyan-900/60 border-cyan-400':'bg-slate-900 border-slate-700'}">${fmt(q)}</button>`).join('')}</div>
 <table class="w-full text-left"><tr class="text-slate-500"><th class="p-1">Ressource</th><th>Bestand</th><th>Marktpreis</th><th>Kaufen</th><th>Verkaufen</th></tr>`;
 for(const r of RES){const pr=S.prices[r.k],pv=S.prev[r.k]||pr,buy=pr*(1+fee),sell=pr*(1-fee),q=S.tq;
  h+=`<tr class="border-t border-slate-800"><td class="p-1"><i class="fa-solid ${r.i} ${r.c}"></i> ${r.n}</td><td>${fmt(S.res[r.k])}</td><td>${pr.toFixed(2)} <span class="${pr>=pv?'text-emerald-400':'text-rose-400'}">${pr>=pv?'▲':'▼'}</span></td>
  <td>${btn(`+${fmt(q)} (${fmt(buy*q)} Cr)`,`trade('${r.k}',${q},1)`,'emerald',S.res.credits<buy*q)}</td><td>${btn(`-${fmt(q)} (+${fmt(sell*q)} Cr)`,`trade('${r.k}',${q},-1)`,'amber',S.res[r.k]<q)}</td></tr>`}
 setBody(h+'</table><div class="mt-2 text-slate-500">Preise schwanken um einen Basiswert; große Orders verschieben den Kurs. Credits bekommst du auch passiv durch Kolonien und Handelszentren.</div>')}
function trade(k,q,dir){const r=RES.find(x=>x.k===k),fee=tradeFee(),pr=S.prices[k];
 if(dir>0){const cost=pr*(1+fee)*q;if(S.res.credits<cost){toast('Nicht genug Credits.');return}S.res.credits-=cost;S.res[k]+=q;S.prices[k]=Math.min(r.p*2,pr+r.p*q*.00004)}
 else{if(S.res[k]<q){toast('Nicht genug '+r.n+'.');return}S.res[k]-=q;S.res.credits+=pr*(1-fee)*q;S.prices[k]=Math.max(r.p*.5,pr-r.p*q*.00004)}
 playSound('click');refreshUI()}

function rEmpire(){const list=myPlanets();if(!list.length){setBody('<div>Keine Kolonien.</div>');return}
 if(S.manage===null||!PS.has(S.manage))S.manage=list.find(p=>p.id===S.capital)?S.capital:list[0].id;
 const p=planets[S.manage],bio=BIOMES[p.biome];
 let h=`<div class="grid md:grid-cols-3 gap-3"><div class="max-h-[60vh] overflow-y-auto space-y-1">${list.map(q=>`<div onclick="S.manage=${q.id};renderModal()" class="cursor-pointer p-2 rounded border ${q.id===S.manage?'border-cyan-400 bg-cyan-950/40':'border-slate-800 bg-slate-950/60 hover:border-slate-600'}"><b>${q.name}</b>${q.id===S.capital?' ★':''}<div class="text-[10px] text-slate-400">${BIOMES[q.biome].name} • Mine Lv ${q.b.mine} • ${fmt(mineRate(q.b.mine,q))}/s ${RN[BIOMES[q.biome].res]}</div></div>`).join('')}</div><div class="md:col-span-2"><div class="mb-2 font-orbitron text-white">${p.name} <span class="text-slate-400 text-xs">– ${bio.name}, Reichtum ${pct(p.rich)}</span> ${btn('Zeigen',`closeModal();jumpTo(${p.x},${p.y})`,'slate')}</div><div class="grid sm:grid-cols-2 gap-2">`;
 for(const k in BLD){const d=BLD[k],l=p.b[k],c=bldCost(k,l),max=l>=BMAX;
  const eff={mine:`+${fmt(mineRate(l,p))}/s ${RN[bio.res]}`,power:`+${Math.round(35*l*(1+tb('pwr')))} Energie`,turret:`Verteidigung ${fmt(l*TURRET*(1+tb('pdef')))}`,lab:`Forschung -${Math.min(30,l*3)}% Kosten`,hub:`+${(1.5*l*(1+tb('cred'))).toFixed(1)} Cr/s, bessere Handelsgebühr`,yard:`Schiffe -${Math.min(40,l*2)}% Kosten`}[k];
  h+=card(`<div class="flex items-center gap-2"><i class="fa-solid ${d.i} ${d.c}"></i><b class="font-orbitron text-white">${d.n}</b><span class="text-cyan-300 ml-auto">Lv ${l}</span></div><div class="text-slate-400 my-1">${eff}</div>${max?'<div class="text-emerald-400">Maximalstufe</div>':`<div class="mb-1">${costHtml(c)}</div>${btn('Ausbauen',`upgradeBuilding(${p.id},'${k}')`,'cyan',!canPay(c))}`}`)}
 setBody(h+'</div></div></div>')}
function upgradeBuilding(pid,k){const p=planets[pid];if(!p||p.owner!==0||p.b[k]>=BMAX)return;const c=bldCost(k,p.b[k]);if(!canPay(c)){toast('Nicht genug Ressourcen.');return}pay(c);p.b[k]++;p.dirty=true;playSound('ok');refreshUI()}

function standings(){const pw=new Float64Array(AIS.length+1);for(const f of fleets)pw[f.owner]+=fleetPower(f);pw[0]+=basePower(S.hangar);
 const tl=Object.values(S.lv).reduce((a,b)=>a+b,0);
 const list=[{id:0,name:ownerName(0),planets:PS.size,power:pw[0],score:PS.size*60+pw[0]/4+tl*20}];
 for(const a of AIS)if(!a.dead)list.push({id:a.id,name:a.name,planets:a.planets,power:pw[a.id],score:a.planets*60+pw[a.id]/4+a.tech*20});
 return list.sort((a,b)=>b.score-a.score)}
function rRank(){const L=standings();
 setBody(`<div class="text-slate-400 mb-2">${L.length} aktive Spieler • Ziel: Platz 1!</div><table class="w-full text-left"><tr class="text-slate-500"><th class="p-1">#</th><th>Name</th><th>Planeten</th><th>Flottenstärke</th><th>Punkte</th></tr>${L.map((s,i)=>`<tr class="border-t border-slate-800 ${s.id===0?'bg-cyan-950/60 font-bold text-cyan-300':'hover:bg-slate-900/60 cursor-pointer'}" ${s.id>0?`onclick="jumpAI(${s.id})"`:''}><td class="p-1">${i+1}</td><td style="color:${ownerColor(s.id)}">${s.name}</td><td>${s.planets}</td><td>${fmt(s.power)}</td><td class="text-amber-400">${fmt(s.score)}</td></tr>`).join('')}</table>`)}

/* --- Suche --- */
function rSearch(){setBody(`<div class="flex flex-wrap gap-2 mb-2"><input id="sq" oninput="doSearch()" placeholder="Planetenname, Spielername oder 'x,y'" class="flex-1 min-w-[200px] bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-white outline-none focus:border-cyan-400"></div><div id="sres" class="space-y-1"></div>`);setTimeout(()=>{const e=$('sq');if(e)e.focus()},50)}
function doSearch(){const q=$('sq').value.trim().toLowerCase(),out=[];if(!q){$('sres').innerHTML='';return}
 const m=q.match(/^(-?\d+)\s*[, ]\s*(-?\d+)$/);
 if(m){const x=+m[1],y=+m[2];let b=null,bd=1e18;for(const p of planets){const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;b=p}}if(b)out.push(b)}
 else{for(const a of AIS)if(a.name.toLowerCase().includes(q)){const p=planets.find(z=>z.owner===a.id);if(p)out.push(p)}
  for(const p of planets){if(out.length>=15)break;if(p.name.toLowerCase().includes(q)&&!out.includes(p))out.push(p)}}
 $('sres').innerHTML=out.slice(0,15).map(p=>`<div onclick="searchGo(${p.id})" class="cursor-pointer p-2 rounded border border-slate-800 bg-slate-950/70 hover:border-cyan-400"><b>${p.name}</b> <span class="text-slate-400">[${p.x}, ${p.y}] • <span style="color:${ownerColor(p.owner)}">${ownerName(p.owner)}</span></span></div>`).join('')||'<div class="text-slate-500">Nichts gefunden.</div>'}
function searchGo(id){const p=planets[id];closeModal();jumpTo(p.x,p.y);sel={type:'planet',id};renderTarget(true)}

/* --- Hilfe --- */
function rHelp(){setBody(`<div class="space-y-2 text-slate-300 text-[13px]"><p><b class="text-cyan-300">Ziel:</b> Starte schwach, baue Wirtschaft, Forschung und Flotten aus – und werde der stärkste von 400 Spielern in einer riesigen Galaxie mit über 14.000 Planeten.</p>
<p><b class="text-cyan-300">Start:</b> Deine Starflotte liegt im Hangar. Öffne <i>Flotten</i>, wähle <i>Platzieren</i> und mache einen <b>Doppelklick</b> auf die Karte nahe deiner Kolonie. Nur platzierte Flotten können kämpfen und verteidigen.</p>
<p><b class="text-cyan-300">Steuerung:</b> Ziehen = Karte verschieben • Mausrad / Pinch = Zoom • Klick = Auswählen • Doppelklick = aktive Flotte platzieren bzw. bewegen • Minimap unten links zum Springen.</p>
<p><b class="text-cyan-300">Angriff:</b> Planet oder fremde Flotte anklicken → <i>Angreifen</i> → Gegnerstärke ansehen, eigene Flotte wählen, Angriff starten oder abbrechen. Siege vernichten alle gegnerischen Schiffe; eigene Verluste hängen von der Stärke des Gegners ab (von keinen bis fast allen). Bei Niederlage ist die ganze Flotte verloren.</p>
<p><b class="text-cyan-300">Warnungen:</b> Greift ein Gegner dich an, erscheint ein Banner – anklicken springt zum Ort. Flotten in 450 Einheiten Umkreis eines Planeten verteidigen ihn automatisch.</p>
<p><b class="text-cyan-300">Wirtschaft:</b> Förderanlagen liefern die Ressource des Planetentyps. Fehlendes kaufst du im Handel. Energie begrenzt die Zahl deiner Schiffe (Kraftwerke, Fusion, Dyson).</p></div>
<div class="flex gap-2 mt-4">${btn('Jetzt speichern','save();toast(\'Gespeichert.\')')}${btn('Neues Spiel','newGame()','rose')}</div>`)}

/* ===== HUD ===== */
function buildResBar(){const tip=(n,x)=>`${n} – Klicken für Produktion, Quellen & Verwendung${x||''}`;
 $('resBar').innerHTML=RES.map(r=>`<div class="resItem flex items-center gap-1" data-res="${r.k}" title="${tip(r.n,r.k==='steel'?'\n+'+STEEL_PM+'/Min Grundeinkommen':(r.k==='food'||r.k==='water')?'\nVersorgt deine Kolonien – genug Vorrat = bis zu +20% Produktion':'')}"><i class="fa-solid ${r.i} ${r.c}"></i><span id="r_${r.k}">0</span></div>`).join('')
 +`<div class="resItem flex items-center gap-1 text-amber-300" data-res="credits" title="${tip('Credits')}"><i class="fa-solid fa-coins"></i><span id="r_credits">0</span></div><div class="resItem flex items-center gap-1" data-res="power" title="${tip('Energie: benutzt / Kapazität')}"><i class="fa-solid fa-bolt text-yellow-400"></i><span id="r_power">0</span></div><div class="resItem flex items-center gap-1 text-fuchsia-300" data-res="gems" title="${tip('Warp-Tokens')}"><i class="fa-solid fa-circle-nodes"></i><span id="r_gems">0</span></div><div class="flex items-center gap-1 bg-amber-950/60 border border-amber-500/40 px-2 py-0.5 rounded text-amber-300 cursor-pointer" data-res="rank" title="Rang / Punkte – Klicken für die Rangliste"><i class="fa-solid fa-trophy"></i><span id="r_rank">-</span></div>`}
let rankCache='-';
function updateHUD(){for(const r of RES)$('r_'+r.k).textContent=fmt(S.res[r.k]);$('r_credits').textContent=fmt(S.res.credits);
 const u=powerUsed(),c=powerCap(),pe=$('r_power');pe.textContent=`${Math.floor(u)}/${Math.floor(c)}`;pe.className=u>c?'text-rose-400':'';
 $('r_rank').textContent=rankCache;$('r_gems').textContent=fmt(S.gems);$('hudCol').textContent=PS.size;
 const mine=fleets.filter(f=>f.owner===0);$('hudFleets').textContent=`${mine.filter(f=>f.placed).length}/${mine.length}`}
function refreshUI(){updateHUD();renderTarget();renderModal();renderLog();if(curModal==='fleets'||!activeFleet)setActive(activeFleet)}

/* ===== START ===== */
window.onload=function(){
 resize();generateWorld();
 for(const r of RES)S.prices[r.k]=r.p;
 const loaded=load();recalcBonus();buildResBar();addonInit(loaded);
 if(!loaded){S.hangar={};const f=newFleet(0,'Flotte 1',startShips(),false);setActive(f.id);addLog('[BEFEHL ONLINE] Platziere deine Startflotte per Doppelklick auf die Karte.')}
 const home=planets[S.capital];cam.x=home.x;cam.y=home.y;cam.zoom=Math.max(MINZ,W<700?.22:.3);rebuildHash();
 if(!loaded)toast('Willkommen, Kommandant! Doppelklick in dein Gebiet um die Hauptwelt, um deine Flotte zu platzieren.');
 let last=performance.now(),uiT=0,saveT=0,rankT=0;
 function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;update(dt);render();
  uiT+=dt;if(uiT>.3){uiT=0;updateHUD();renderTarget();renderLog()}
  miniT+=dt;if(miniT>.6){miniT=0;renderMini()}
  rankT+=dt;if(rankT>4){rankT=0;const L=standings();rankCache='#'+(L.findIndex(s=>s.id===0)+1)+'/'+L.length}
  saveT+=dt;if(saveT>20){saveT=0;save()}
  requestAnimationFrame(frame)}
 requestAnimationFrame(frame);
 window.addEventListener('beforeunload',save);
};

<script>
/* ===== ADD-ON: Gacha, Daily, Profil, Dev, Offline, Wache, Rückzug, Forschung ===== */
const DEVPW='Godmode';
const cleanTxt=s=>String(s||'').replace(/[<>&"'`]/g,'').trim();
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
TITLES.gacha='SCHIFFE ANHEUERN';TITLES.daily='TAGESBELOHNUNG';TITLES.profile='PROFIL & SPIELSTAND';

/* --- Start: Spieler beginnt etwa auf Rang 100 --- */
function startShips(){const ships={scout:4,corvette:2},hp=planets[S.capital];hp.b.power=4;hp.dirty=true;S.hangar=ships;
 const rank=()=>standings().findIndex(s=>s.id===0)+1;
 for(const id of ['frigate','corvette','scout']){for(let g=0;g<60&&rank()>100;g++){if(powerUsed()+SHIP[id].pw>powerCap()){if(hp.b.power<14)hp.b.power++;else break}ships[id]=(ships[id]||0)+1;if(rank()<93){ships[id]--;break}}}
 S.hangar={};return ships}

function layoutVars(){const h=document.querySelector('header');if(h)document.documentElement.style.setProperty('--hh',h.offsetHeight+'px')}
function toggleTapMove(){S.tapMove=!S.tapMove;updTapBtn()}
function updTapBtn(){const b=$('tapBtn');if(b){b.textContent=S.tapMove?'Tippen=Bewegen ✓':'Tippen=Bewegen';b.style.background=S.tapMove?'rgba(8,145,178,.5)':''}}

/* --- Forschung mit Laufzeit, Ebenen und Mehrfach-Voraussetzungen --- */
const reqOk=r=>{const [id,l]=r.split(':');return(S.lv[id]||0)>=(+l||1)};
const reqName=r=>{const [id,l]=r.split(':');return TECHS.find(x=>x.id===id).name+(l?' Lv'+l:'')};
const TM={flak_tech:.35,flak_dmg:.5,flak_rng:.5,shield_hp:.5,shield_rad:.5};
function techTime(t){let s=0;for(const k in t.cost)s+=t.cost[k];return Math.min(1500,6*Math.sqrt(s/8))*(TM[t.id]||1)*(1+.4*(S.lv[t.id]||0))/(1+.04*bsum('lab')+tb('rspd'))}
const fdur=s=>{s=Math.ceil(s);return s>=3600?Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m':s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s'};
function techDepth(t,m={}){if(m[t.id])return m[t.id];let d=1;for(const r of t.req){const x=TECHS.find(q=>q.id===r.split(':')[0]);if(x)d=Math.max(d,1+techDepth(x,m))}return m[t.id]=d}
function doResearch(id){const t=TECHS.find(x=>x.id===id),l=S.lv[id]||0;if(l>=t.max||t.req.some(r=>!reqOk(r)))return;
 if(S.rq&&!S.dev){toast('Es läuft bereits eine Forschung.');return}const c=techCost(t);if(!canPay(c)){toast('Nicht genug Ressourcen.');return}
 pay(c);S.rq={id,lvl:l+1,start:S.T,end:S.T+(S.dev?0:techTime(t)),c};playSound('click');toast(t.name+' wird erforscht …');refreshUI()}
function finishResearch(){const q=S.rq;if(!q)return;S.rq=null;const t=TECHS.find(x=>x.id===q.id);S.lv[q.id]=q.lvl;recalcBonus();playSound('ok');addLog(`[FORSCHUNG] ${t.name} Stufe ${q.lvl} abgeschlossen.`);toast('Forschung abgeschlossen: '+t.name);refreshUI()}
function cancelResearch(){const q=S.rq;if(!q)return;for(const k in q.c)S.res[k]+=Math.floor(q.c[k]*.5);S.rq=null;toast('Forschung abgebrochen (50% erstattet).');refreshUI()}
function rResearch(){
 const tabs=Object.entries(TREES).map(([k,t])=>{const all=TECHS.filter(x=>x.tree===k),done=all.filter(x=>(S.lv[x.id]||0)>=x.max).length;
  return`<button onclick="S.tab='${k}';renderModal()" class="px-2.5 py-1.5 rounded border text-[11px] font-orbitron ${S.tab===k?'bg-cyan-900/60 border-cyan-400 text-white':'bg-slate-900 border-slate-700 text-slate-300'}"><i class="fa-solid ${t.i} ${t.c}"></i> ${t.n} <span class="text-slate-400">${done}/${all.length}</span></button>`}).join('');
 const sum=[['atk','Waffen'],['arm','Panzerung'],['spd','Tempo'],['eco','Ertrag'],['cred','Credits'],['pwr','Energie']].filter(([k])=>tb(k)>0).map(([k,n])=>`${n} +${pct(tb(k))}`).join(' • ');
 let h=`<div class="flex flex-wrap gap-1 mb-2">${tabs}</div><div class="text-slate-400 mb-2">Labor-Rabatt ${pct(Math.min(.55,.03*bsum('lab')+tb('tcost')))} • Forschungstempo +${pct(.04*bsum('lab')+tb('rspd'))}${sum?'<br>Aktive Boni: '+sum:''}</div>`;
 const q=S.rq;if(q){const t=TECHS.find(x=>x.id===q.id);h+=card(`<div class="flex justify-between items-center"><b class="font-orbitron text-cyan-300"><i class="fa-solid fa-flask fa-beat-fade"></i> ${t.name} → Stufe ${q.lvl}</b><span id="rqTime" class="text-amber-300"></span></div><div class="bar my-1.5"><div id="rqBar" style="background:#22d3ee;width:0%"></div></div>${btn('Abbrechen (50% zurück)','cancelResearch()','rose')}`,'mb-3')}
 const dm={},list=TECHS.filter(t=>t.tree===S.tab).sort((a,b)=>techDepth(a,dm)-techDepth(b,dm));let lastD=0;
 for(const t of list){const d=techDepth(t,dm);if(d!==lastD){if(lastD)h+='</div>';h+=`<div class="text-[10px] font-orbitron text-slate-500 mt-3 mb-1">EBENE ${d}</div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">`;lastD=d}
  const l=S.lv[t.id]||0,maxed=l>=t.max,c=techCost(t),miss=t.req.filter(r=>!reqOk(r)),busy=!!S.rq&&S.rq.id===t.id;
  h+=`<div id="tech_${t.id}"${miss.length&&!maxed?` onclick="gotoTech('${miss[0].split(':')[0]}')" style="cursor:pointer"`:''}>`+card(`<div class="flex justify-between"><b class="font-orbitron text-white">${t.name}</b><span class="${maxed?'text-emerald-400':'text-cyan-300'}">${l}/${t.max}</span></div><div class="text-slate-400 my-1">${t.desc}</div>`
  +(t.req.length?`<div class="text-[10px] mb-1">${t.req.map(r=>`<span onclick="event.stopPropagation();gotoTech('${r.split(':')[0]}')" style="cursor:pointer;text-decoration:underline" class="${reqOk(r)?'text-emerald-400':'text-rose-400'}">${reqOk(r)?'✓':'✗'} ${reqName(r)}</span>`).join(' · ')}</div>`:'')
  +(maxed?'<div class="text-emerald-400">Vollständig erforscht</div>':`<div class="mb-1">${costHtml(c)} · <span class="text-slate-400"><i class="fa-regular fa-clock"></i> ${S.dev?'sofort':fdur(techTime(t))}</span></div>`+(miss.length?'<div class="text-rose-400"><i class="fa-solid fa-lock"></i> Gesperrt – Klick springt zur Voraussetzung</div>':busy?'<div class="text-amber-300">wird erforscht …</div>':btn(l?'Verbessern':'Erforschen',`doResearch('${t.id}')`,'cyan',!canPay(c)||(!!S.rq&&!S.dev)))),maxed||!miss.length?'':'opacity-70')+'</div>'}
 setBody(h+'</div>')}
function gotoTech(id){const t=TECHS.find(x=>x.id===id);if(!t)return;S.tab=t.tree;renderModal();setTimeout(()=>{const e=document.getElementById('tech_'+id);if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.style.outline='2px solid #22d3ee';e.style.borderRadius='8px';setTimeout(()=>{e.style.outline=''},2000)}},60)}
RENDER.research=rResearch;

/* --- Tick: Dev-Modus, Forschung, Wachflotten --- */
let _rtU=0;
const MINE_R=260,MINE_D=3500,MINE_COST={steel:450,copper:220,coal:120},AA_D=190,AA_R=900,AA_DPS=120,AA_COST={steel:300,copper:180},AA_BASE=3,MINE_BASE=15;
function ensureB(){if(!S.mines)S.mines=[];if(!S.aa)S.aa=[];if(!S.stock)S.stock={mine:0,aa:0}}
/* --- Ländergrenzen (Territorien) --- */
/* --- Versorgung: Nahrung & Wasser --- */
const SUP_BONUS=.2,SUP_RES=120;
function supplyInfo(){let dem=0;for(const i of PS)dem+=.03+.09*(planets[i].b.mine||0);
 const cF=dem>0?clamp(S.res.food/(dem*SUP_RES),0,1):1,cW=dem>0?clamp(S.res.water/(dem*SUP_RES),0,1):1;
 return{dem,cF,cW,bonus:SUP_BONUS*Math.min(cF,cW)}}
setInterval(()=>{try{const su=supplyInfo();for(const k of['food','water']){const el=$('r_'+k);if(!el)continue;const c=k==='food'?su.cF:su.cW;el.style.color=c<.25?'#fb7185':c<1?'#fbbf24':''}}catch(e){}},800);

<p><b class="text-cyan-300">Verteidigung:</b> Kolonie antippen → <i>Flotte zuweisen</i>. Wachflotten verteidigen automatisch und kehren nach Gefechten zurück. Minen musst du mit einer Flotte zum Zielort bringen (Raumwerft → Mine → „Mit Flotte legen“); abgelegt werden sie erst nach einigen Sekunden scharf. Gegnerische Minen kannst du im Raketenstart anvisieren: kleine Raketen entschärfen sie, mittlere/große zünden sie (mit Kettenreaktion und Schaden an allen Flotten im Radius – Abstand halten!). Gegner-KIs greifen andere KIs und dich an, sobald in ihrer Nähe keine freien Planeten mehr zu holen sind, und beschießen Minen mit Raketen.</p>
<p><b class="text-cyan-300">Angriffswarnung:</b> Greift ein Gegner an, siehst du Ankunftszeit und einen <i>Rückzug</i>-Button, der alle Flotten im Gefahrenbereich zu einer sicheren Kolonie schickt. Offline wirst du nie angegriffen.</p>
<p><b class="text-cyan-300">Forschung:</b> Dauert Zeit (nur eine gleichzeitig), hat Ebenen und Mehrfach-Voraussetzungen. Labore und Wissenschafts-Techs beschleunigen.</p>

<p><b class="text-cyan-300">Gegner-Verteidigung:</b> KI-Imperien bauen ebenfalls Minen und Flak-Plattformen (violett dargestellt – deine Minen sind gelb-orange, deine Flaks blau). Elite-Imperien (◆ mittel, ★ stark, ★★ sehr stark) haben sich weit ausgebreitet, besitzen mehr und größere Flotten und rüsten schneller auf – ideale Gegner für das späte Spiel. Ländergrenzen: dein Gebiet ist leicht blau mit markanterer Grenze, Gegner sind dezent rot, neutrale Gebiete grau (änderbar im Hilfe-Menü). Tarn-Jäger-Flotten sind für Gegner erst kurz vor ihrem Ziel sichtbar – deine eigenen erscheinen halbtransparent. Nahrung &amp; Wasser versorgen deine Kolonien: ein ausreichender Vorrat beider Güter steigert die Produktion aller anderen Planeten und deine Credits um bis zu +20 % (die Ressourcen-Leiste färbt sich bei knappem Vorrat gelb/rot). Pro Planet sind bis zu 8 Flak-Plattformen möglich (Forschung „Flak-Batterien“) rund um ihre Kolonien. Sie treffen nur deine Flotten – plane Angriffe also mit Abstand oder mit genug Reserve.</p></div><div class="flex gap-2 mt-4">${btn('Jetzt speichern',"save();toast('Gespeichert.')")}${btn('Profil & Spielstand',"openModal('profile')",'slate')}${btn('Screen-Effekte (Shake/Blitz): '+(FXCFG.on?'AN':'AUS'),'toggleFx()','slate')}${btn('Ländergrenzen: '+(BORD.on?'AN':'AUS'),'toggleBord()','slate')}${btn('Bot-Stärke: '+((S.diff||1)<1?'Leicht':(S.diff||1)>1?'Schwer':'Normal'),'cycleDiff()','amber')}</div>`)}

const SHAKES=[];

function shakeOff(){if(!SHAKES.length)return[0,0];const n=performance.now();let a=0;
 for(let i=SHAKES.length-1;i>=0;i--){const s=SHAKES[i],k=(n-s.t0)/s.dur;if(k>=1){SHAKES.splice(i,1);continue}if(k<0)continue;a=Math.max(a,s.amp*(1-k)*(1-k))}
 return[Math.sin(n*.083)*a+Math.sin(n*.211)*a*.45,Math.cos(n*.097)*a+Math.cos(n*.17)*a*.45]}

function resPopHtml(k){const m=RMETA(k),li=a=>a.map(x=>`<li class="mb-0.5">${x}</li>`).join('');let stock,head,body='',btns='';

  body+=sbox;btns=(r.bi.length||k==='credits'?btn('Imperium',"goModal('empire')",'cyan'):'')+btn('Handel',"goModal('trade')",'emerald')}
 return `<div class="flex items-center justify-between mb-2"><div class="flex items-center gap-2"><i class="fa-solid ${m.i} ${m.c} text-xl"></i><div><div class="font-orbitron text-sm text-white">${m.n}</div><div class="text-[11px] text-slate-400">Bestand: <b class="text-slate-200">${stock}</b></div></div></div><button onclick="hideResPop()" class="text-slate-400 hover:text-white px-1"><i class="fa-solid fa-xmark"></i></button></div>

 <div class="flex flex-wrap gap-2 mt-3">${btns}</div>`}

 const c=[],R=11;

 return r}}

(function(){

 const m=AU.master=c.createGain();m.gain.value=AU.vol;m.connect(comp);comp.connect(c.destination);
 const len=Math.floor(c.sampleRate*2.4),ir=c.createBuffer(2,len,c.sampleRate);
 for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}

 try{startAmbient()}catch(e){console.warn('amb',e)}

 const src=c.createBufferSource();src.buffer=AU.nb;const f=c.createBiquadFilter();f.type=o.ft||'lowpass';f.frequency.setValueAtTime(o.f,t0);

 const g=c.createGain();env(g,t0,a,r,pk);src.connect(f);f.connect(g);route(o,g);AU.voices++;src.onended=()=>{AU.voices--};
 src.start(t0,Math.random()*1.5);src.stop(t0+a+r+.05)}

function play(n,x){
 if(typeof audioOn==='undefined'||!audioOn)return;
 const c=init();if(!c)return;if(c.state==='suspended')c.resume();
 const now=performance.now();
 if(n==='boom'&&AU.skipBoom)return;

 const mi=MIN[n]===undefined?0:MIN[n];if(mi&&AU.last[n]&&now-AU.last[n]<mi)return;AU.last[n]=now;
 x=x||{};CUR.v=x.v===undefined?1:x.v;CUR.pan=0;CUR.t=x.t||0;CUR.s=x.s||1;
 let px=x.x,py=x.y;if(px===undefined&&AU.at){px=AU.at.x;py=AU.at.y}
 if(px!==undefined&&typeof w2s==='function'){const [sx,sy]=w2s(px,py);CUR.pan=Math.max(-1,Math.min(1,sx/W*2-1))*.7;const off=Math.max(0,Math.max(Math.abs(sx/W-.5)*2,Math.abs(sy/H-.5)*2)-1);CUR.v*=1/(1+off*1.5)}
 if(n==='victory'||n==='defeat')AU.last.vd=now;
 try{(SND[n]||SND.click)()}catch(e){console.warn('snd',n,e)}
}

 const lfo=c.createOscillator(),ld=c.createGain();lfo.frequency.value=.06;ld.gain.value=260;lfo.connect(ld);ld.connect(lp.frequency);lfo.start();
 lp.connect(out);out.connect(AU.master);const s=c.createGain();s.gain.value=.5;out.connect(s);s.connect(AU.revIn);
 CH[0].forEach((f,i)=>{const o=c.createOscillator();o.type=i%2?'triangle':'sine';o.frequency.value=f;o.detune.value=(i%3-1)*4;const g=c.createGain();g.gain.value=.16;o.connect(g);g.connect(lp);o.start();_oscs.push(o)});

setInterval(()=>{try{if(!AU.ctx)return;const t=AU.ctx.currentTime,on=(typeof audioOn!=='undefined'&&audioOn)&&!document.hidden;

 let n=0;if(typeof fleets!=='undefined')for(const f of fleets)if(f.owner===0&&f.placed&&!f.dead&&f.order)n++;

 if(document.hidden&&AU.ctx.state==='running')AU.ctx.suspend();else if(!document.hidden&&AU.ctx.state==='suspended'&&on)AU.ctx.resume()}catch(e){}},300);

function addW(id,n){if(!(n>0))return;S.wrecks=S.wrecks||{};S.wrecks[id]=(S.wrecks[id]||0)+n;
 const t=performance.now();if(t-_wt>1500){_wt=t;toast(SHIP[id].name+' zerstört – Wrack in der Raumwerft reparierbar.')}
 addLog('[WRACK] '+SHIP[id].name+' kann in der Raumwerft repariert werden.')}
const wCost=id=>shipCost({cost:WC[SHIP[id].r]});

const _al=applyLoss;
applyLoss=function(dicts){const mine=new Set();for(const f of fleets)if(f.owner===0)mine.add(f.ships);
 const snaps=[];for(const d of dicts)if(mine.has(d))snaps.push([d,gsnap(d)]);
 const r=_al.apply(this,arguments);
 for(const [d,b] of snaps)for(const t in b){const l=b[t]-(d[t]||0);if(l>0)addW(t,l)}
 return r};
const _hf=hitFleet;
hitFleet=function(f){const b=f&&f.owner===0?gsnap(f.ships):null;const r=_hf.apply(this,arguments);
 if(b)for(const t in b){const l=b[t]-(f.ships[t]||0);if(l>0)addW(t,l)}return r};

window.repairShip=function(id,n){const w=S.wrecks||{};n=Math.min(n,w[id]||0);if(n<=0||!SHIP[id])return;
 const c=wCost(id),tot={};for(const k in c)tot[k]=c[k]*n;
 if(powerUsed()+SHIP[id].pw*n>powerCap()){toast('Nicht genug Energie für die Reparatur.');return}
 if(!canPay(tot)){toast('Nicht genug Ressourcen.');return}
 pay(tot);w[id]-=n;if(w[id]<=0)delete w[id];S.hangar[id]=(S.hangar[id]||0)+n;
 playSound('ok');if(window.SOUND)SOUND.play('rdone',{v:.7});
 toast(n+'× '+SHIP[id].name+' repariert – im Hangar.');addLog('[REPARATUR] '+n+'× '+SHIP[id].name+' repariert.');refreshUI()};

function wHtml(){const w=S.wrecks||{},ids=Object.keys(w).filter(id=>w[id]>0&&SHIP[id]).sort((a,b)=>SHIP[b].power-SHIP[a].power);
 if(!ids.length)return '';
 return '<h3 class="font-orbitron text-amber-300 mt-4 mb-2"><i class="fa-solid fa-screwdriver-wrench"></i> WRACKS – SUPERSCHIFFE REPARIEREN</h3><div class="text-slate-400 mb-1">Zerstörte Superschiffe gehen nicht verloren. Repariert landen sie im Hangar und brauchen wieder Energie.</div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">'
 +ids.map(id=>{const s=SHIP[id],c=wCost(id),col=RAR[s.r].c;
  return card(`<div style="color:${col}"><i class="fa-solid ${s.icon}"></i> <b>${s.name}</b> ×${w[id]}</div><div class="text-slate-400">Stärke ${fmt(s.power)} • Energie ${s.pw}</div><div class="my-1">${costHtml(c)} <span class="text-slate-500">je Schiff</span></div><div class="flex gap-1">${btn('Reparieren ×1',`repairShip('${id}',1)`,'emerald',!canPay(c))}${w[id]>1?btn('Alle ('+w[id]+')',`repairShip('${id}',${w[id]})`,'amber'):''}</div>`)}).join('')+'</div>'}
function addPanel(){if(!curModal||(curModal!=='yard'&&curModal!=='fleets'))return;const b=document.getElementById('modalBody');if(!b)return;
 let d=document.getElementById('wreckPanel');const h=wHtml();if(!h){if(d)d.remove();return}
 if(!d||!d.isConnected){d=document.createElement('div');d.id='wreckPanel';b.appendChild(d)}
 setHtml(d,h)}
for(const k of ['yard','fleets']){const o=RENDER[k];RENDER[k]=function(){o();addPanel()}}
})();

</script>
<script>
/* ===== v3.9.2: Angriffswarnungen als überlappender Benachrichtigungs-Stapel (wie am Handy) ===== */
let AL_X=false;
function alRender(){const now=S.T;
 for(let i=ALS.length-1;i>=0;i--){const a=ALS[i],m=a.meta;
  if(m){const att=fleetById.get(m.aid);if(att&&!att.dead){const tg=m.kind==='fleet'?fleetById.get(m.id):planets[m.id];if(tg){const eta=Math.max(0,Math.round(Math.hypot(tg.x-att.x,tg.y-att.y)/fleetSpeed(att)/S.gs));a.text=a.text.replace(/Ankunft in ca\. \d+ s/,'Ankunft in ca. '+eta+' s')}}if(m.kind==='fleet'){const tp=fleetById.get(m.id);if(tp&&!tp.dead){a.x=tp.x;a.y=tp.y}}
   if(!att||att.dead||!att.order||att.order.type!=='atk'||att.order.id!==m.id||now-a.t>900)ALS.splice(i,1)}
  else if(now-a.t>(/abgewehrt/i.test(a.text)?6:25))ALS.splice(i,1)}
 const box=alBox(),list=ALS.slice(-6).reverse(),n=list.length;
 box.style.cssText='position:absolute;top:calc(var(--hh,90px) + 48px);left:50%;transform:translateX(-50%);width:min(92vw,28rem);z-index:30;pointer-events:none';
 if(n<2)AL_X=false;
 /* nicht mehr angezeigte Karten entfernen */
 for(const ch of Array.from(box.children)){if(ch.id==='alCollapse')continue;if(!ch._a||!list.includes(ch._a)){ch.remove()}}
 const cards=list.map(a=>{if(!a.el)a.el=alCard(a);const d=a.el;d._a=a;a.lbl.textContent=(a.meta?'⚠ ':'ℹ ')+a.text;
  if(!d.isConnected){d.style.opacity='0';d.style.transform='translateY(-18px) scale(.96)';box.appendChild(d);void d.offsetHeight}return d});
 for(const d of cards)d.style.height='auto';
 const hF=cards[0]?cards[0].offsetHeight:0;
 let ctl=document.getElementById('alCollapse');
 if(AL_X&&n>1){if(!ctl){ctl=document.createElement('div');ctl.id='alCollapse';ctl.style.cssText='position:absolute;left:0;right:0;text-align:center;font-size:11px;color:#fda4af;cursor:pointer;pointer-events:auto;padding:2px 0;transition:top .25s ease';ctl.onclick=()=>{AL_X=false;alRender()};box.appendChild(ctl)}
  ctl.textContent='▲ Einklappen'+(ALS.length>6?' • +'+(ALS.length-6)+' weitere':'')}
 else if(ctl)ctl.remove();
 let y=0;
 cards.forEach((d,i)=>{const a=d._a;a.bdg.textContent='+'+(n-1);a.bdg.style.display=(!AL_X&&i===0&&n>1)?'':'none';
  if(AL_X){const h=d.offsetHeight;d.style.top=y+'px';d.style.transform='none';d.style.opacity='1';d.style.zIndex=40-i;d.style.pointerEvents='auto';d.style.overflow='';
   for(const c of d.children)c.style.visibility='';y+=h+6}
  else if(i<4){d.style.height=hF+'px';d.style.top=i*9+'px';d.style.transform='scale('+(1-i*.045).toFixed(3)+')';d.style.opacity=String(Math.max(.3,1-i*.22));d.style.zIndex=40-i;d.style.pointerEvents='auto';d.style.overflow='hidden';
   for(const c of d.children)c.style.visibility=i?'hidden':''}
  else{d.style.top='27px';d.style.transform='scale(.86)';d.style.opacity='0';d.style.pointerEvents='none'}});
 if(AL_X){const ctl2=document.getElementById('alCollapse');if(ctl2){ctl2.style.top=y+'px';y+=20}box.style.height=Math.max(0,y-6)+'px'}
 else box.style.height=(hF+Math.min(3,Math.max(0,n-1))*9)+'px'}
function alCard(a){const d=document.createElement('div');
 d.className='glass-panel-rose rounded-lg border border-rose-500/60 px-3 py-1.5 flex items-center justify-between shadow-2xl cursor-pointer';
 d.style.cssText='position:absolute;left:0;right:0;top:0;transition:top .28s ease,transform .28s ease,opacity .28s ease;transform-origin:top center;pointer-events:auto';
 d.onclick=()=>{const front=ALS[ALS.length-1];if(!AL_X&&front!==a&&ALS.length>1){AL_X=true;alRender()}else jumpTo(a.x,a.y)};
 const l=document.createElement('div');l.className='text-xs text-slate-200';d.appendChild(l);a.lbl=l;
 const r=document.createElement('div');r.className='flex items-center';r.style.flex='none';
 const bd=document.createElement('button');bd.className='text-[10px] text-rose-200 border border-rose-500/60 rounded-full px-1.5 ml-2';bd.style.display='none';bd.title='Alle Warnungen anzeigen';
 bd.onclick=e=>{e.stopPropagation();AL_X=true;alRender()};a.bdg=bd;r.appendChild(bd);
 if(a.meta){const b=document.createElement('button');b.className='px-2 py-1 rounded bg-rose-700 hover:bg-rose-600 text-white text-[11px] whitespace-nowrap ml-2';b.textContent='Rückzug';b.onclick=e=>{e.stopPropagation();lastAlert=a;doRetreat();alRemove(a)};r.appendChild(b)}
 const x=document.createElement('button');x.className='text-rose-400 text-sm ml-2';x.textContent='✕';x.onclick=e=>{e.stopPropagation();alRemove(a)};r.appendChild(x);
 d.appendChild(r);return d}

</script>
<script>
/* ===== v3.9.3: Kampfsequenz abwarten – Angreifer UND Verteidiger bleiben während der Schusssequenz stehen (auch bei Flotte-gegen-Flotte) ===== */
{const _sbh=spawnBattle;spawnBattle=function(f,tx,ty,defOwner,r,myth){const d=_sbh.apply(this,arguments);
 try{if(d&&f){const until=performance.now()+d;f.hold=Math.max(f.hold||0,until);
  for(const e of nearby(tx,ty,700,e=>!e.dead&&e!==f&&e.owner===defOwner&&(e.owner>0||e.placed)))e.hold=Math.max(e.hold||0,until)}}catch(e){console.warn('hold',e)}
 return d}}

</script>
